<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恆大集團</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC","Microsoft JhengHei","Segoe UI",system-ui,sans-serif;}
        body{
            background: linear-gradient(135deg, #1f1f1f 0%, #2e2e2e 100%);
            color:#f5f5f7;
        }

        .glass{
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        .home-page{
            position:fixed;
            inset:0;
            background: linear-gradient(135deg, #1e1e1e 0%, #3a3a3a 100%);
            z-index:10000;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:24px;
            overflow:hidden;
        }

        .sign-in-btn{
            position:absolute;
            top:18px;
            right:18px;
            width:46px;
            height:46px;
            border-radius:50%;
            background:rgba(255,255,255,0.14);
            backdrop-filter: blur(18px) saturate(130%);
            -webkit-backdrop-filter: blur(18px) saturate(130%);
            border:1px solid rgba(255,255,255,0.20);
            box-shadow:0 4px 18px rgba(0,0,0,0.22);
            color:#ffffff;
            font-size:14px;
            font-weight:600;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            transition:0.22s ease;
            z-index:10;
        }
        .sign-in-btn:hover{
            background:rgba(255,255,255,0.24);
            transform:scale(1.05);
        }
        .sign-in-btn:active{
            transform:scale(0.97);
        }

        .grid-bg{
            position:absolute;
            width:180vmax;
            height:180vmax;
            top:50%;
            left:50%;
            z-index:1;
            pointer-events:none;
            transform-origin: center center;
            animation: filmScroll 60s linear infinite;
        }
        @keyframes filmScroll {
            0% {
                transform: translate(-50%, -50%) rotate(45deg) translate(0, 0);
            }
            100% {
                transform: translate(-50%, -50%) rotate(45deg) translate(80vmax, 80vmax);
            }
        }

        .grid-row{
            display:grid;
            grid-template-columns:repeat(8, 1fr);
            gap:12px;
            margin-bottom:12px;
        }
        .grid-row.offset-row{
            padding-left:calc(12vmax / 16);
        }
        .grid-cell{
            border:1px solid rgba(255,255,255,0.10);
            overflow:hidden;
            aspect-ratio:1/1;
            border-radius:10px;
        }
        .grid-cell img{
            width:100%;
            height:100%;
            object-fit:cover;
            opacity:0.10;
        }

        .home-content{
            position:relative;
            z-index:10;
            text-align:center;
            max-width:380px;
            width:100%;
        }
        .home-page h1{
            color:#ffffff;
            margin-bottom:52px;
            font-size:48px;
            font-weight:800;
            letter-spacing:1px;
        }
        .home-btn{
            width:100%;
            padding:22px 20px;
            margin:14px 0;
            border:none;
            border-radius:20px;
            font-size:20px;
            font-weight:600;
            cursor:pointer;
            transition:all 0.26s ease;
            background:rgba(255,255,255,0.16);
            backdrop-filter: blur(18px) saturate(130%);
            -webkit-backdrop-filter: blur(18px) saturate(130%);
            border:1px solid rgba(255,255,255,0.22);
            box-shadow:0 6px 24px rgba(0,0,0,0.18);
            color:#ffffff;
        }
        .home-btn:hover{
            background:rgba(255,255,255,0.28);
            transform:translateY(-3px) scale(1.01);
            box-shadow:0 12px 34px rgba(0,0,0,0.25);
        }
        .home-btn:active{
            transform:translateY(1px) scale(0.995);
        }

        .top-bar{
            background: rgba(45,45,45,0.88);
            backdrop-filter: blur(22px) saturate(145%);
            -webkit-backdrop-filter: blur(22px) saturate(145%);
            border-bottom:1px solid rgba(255,255,255,0.14);
            color:#ffffff;
            padding:18px 16px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            box-shadow:0 2px 18px rgba(0,0,0,0.30);
        }
        .top-bar h2{font-size:18px;font-weight:600;letter-spacing:-0.3px;}
        .back-home{
            background:rgba(255,255,255,0.12);

        .mask{

            background:rgba(0,0,0,0.42);

            z-index:9999;
            display:none;
            align-items:center;
            justify-content:center;
            padding:16px;
        }
        .modal{
            background: rgba(55,55,55,0.94);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border:1px solid rgba(255,255,255,0.20);

        }

        .preview-box{

        .form-row{margin:14px 0;}

</head>
<body>

<!-- 首頁封面 -->
<div class="home-page" id="homePage">
    <button class="sign-in-btn" id="signInBtn">Sign In</button>

    <div class="grid-bg" id="gridBg"></div>
    <div class="home-content">
        <h1>恆大集團</h1>
        <button class="home-btn" onclick="enterBasketball()">籃球 - 場館預約</button>

        <button class="home-btn" onclick="enterTennis()">網球 - 球拍借用</button>
    </div>
</div>

<!-- 登入註冊彈窗 -->
<div class="auth-mask" id="authMask">

        <button class="auth-close" onclick="closeAuth()">×</button>

        <div id="loginView">
            <h2 class="auth-title">Sign In</h2>

                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="輸入您的電郵">
            </div>
            <div class="auth-item">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="輸入您的密碼">
            </div>

            </div>
        </div>

            <h2 class="auth-title">Register</h2>
            <div class="auth-item">
                <label>Name</label>
                <input type="text" id="registerName" placeholder="輸入您的姓名">
            </div>
            <div class="auth-item">
                <label>Email</label>

        <button class="btn btn-cancel" onclick="closeBook()">取消</button>

<script>
let currentUser = null;

(function buildBackgroundGrid(){
    const imageList = [
        "lebron.jpg",
        "federer.jpg",
        "lin.jpg",
        "harden.jpg",
        "lee.jpg"
    ];
    const gridContainer = document.getElementById("gridBg");
    const rowCount = 24;
    const colCount = 8;
    const gridIndexTable = [];

    for(let r=0; r<rowCount; r++){
        const rowWrap = document.createElement("div");
        rowWrap.className = "grid-row" + (r % 2 ===1 ? " offset-row":"");
        gridIndexTable[r] = [];

        for(let c=0; c<colCount; c++){
            const forbid = new Set();
            if(r>0) forbid.add(gridIndexTable[r-1][c]);
            if(c>0) forbid.add(gridIndexTable[r][c-1]);
            if(r>0 && c>0) forbid.add(gridIndexTable[r-1][c-1]);
            if(r>0 && c+1 < colCount) forbid.add(gridIndexTable[r-1][c+1]);

            let available = [];
            for(let i=0;i<imageList.length;i++){
                if(!forbid.has(i)) available.push(i);
            }
            const pickIdx = available[Math.floor(Math.random()*available.length)];
            gridIndexTable[r][c] = pickIdx;

            const cell = document.createElement("div");
            cell.className = "grid-cell";
            const img = document.createElement("img");
            img.src = imageList[pickIdx];
            img.draggable = false;
            cell.appendChild(img);
            rowWrap.appendChild(cell);
        }
        gridContainer.appendChild(rowWrap);
    }
})();

let map;
let myPos = {lat:null,lng:null};
let currentSport = "badminton";
let currentShopIdx = null;
let currentRacketIdx = null;
let activeOrder = null;
let bookOrder = null;
let shopRacketData = [];
let markerList = [];
let selectedReturnImageFile = null;

const returnPhotoInput = document.getElementById("returnPhotoInput");
returnPhotoInput.addEventListener('change',function(e){
    const file = e.target.files[0];
    if(!file) return;
    selectedReturnImageFile = file;
    const previewBox = document.getElementById("returnPreviewBox");
    const reader = new FileReader();
    reader.onload = function(ev){
        previewBox.innerHTML = `<img src="${ev.target.result}" alt="歸還照片預覽">`;
        document.getElementById("submitReturnBtn").disabled = false;
    }
    reader.readAsDataURL(file);
})

document.getElementById("signInBtn").addEventListener("click", function(){
    document.getElementById("authMask").style.display = "flex";
    showLogin();
});

function closeAuth(){
    document.getElementById("authMask").style.display = "none";
}

function showLogin(){
    document.getElementById("loginView").style.display = "block";
    document.getElementById("registerView").style.display = "none";
}

function showRegister(){
    document.getElementById("loginView").style.display = "none";
    document.getElementById("registerView").style.display = "block";
}

function handleLogin(){
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();

    if(!email || !password){
        alert("請填寫 Email 和 Password");
        return;
    }

    currentUser = {
        name: email.split("@")[0],
        email: email
    };

    updateUserUI();
    closeAuth();
    alert("登入成功：" + currentUser.email);
}

function handleRegister(){
    const name = document.getElementById("registerName").value.trim();
    const email = document.getElementById("registerEmail").value.trim();
    const password = document.getElementById("registerPassword").value.trim();

    if(!name || !email || !password){
        alert("請填寫完整註冊資訊");
        return;
    }

    currentUser = {
        name: name,
        email: email
    };

    updateUserUI();
    closeAuth();
    alert("註冊成功：" + currentUser.name);
}

function signOut(){
    currentUser = null;
    updateUserUI();
    alert("已登出");
}

function updateUserUI(){
    const signInBtn = document.getElementById("signInBtn");
    const userInfoBar = document.getElementById("userInfoBar");
    const userName = document.getElementById("userName");
    const userAvatar = document.getElementById("userAvatar");

    if(currentUser){
        signInBtn.style.display = "none";
        userInfoBar.style.display = "flex";
        userName.textContent = currentUser.name;
        userAvatar.textContent = currentUser.name.charAt(0).toUpperCase();
    }else{
        signInBtn.style.display = "flex";
        userInfoBar.style.display = "none";
    }
}

function enterBasketball(){
    currentSport = "basketball";
    document.getElementById("homePage").style.display = "none";
    document.getElementById("appPage").style.display = "block";
    document.getElementById("pageTitle").innerText = "籃球場館預約";
    document.getElementById("pageSubTitle").innerText = "場地280元/場";
    initMapApp();
}
function enterBadminton(){
    currentSport = "badminton";
    document.getElementById("homePage").style.display = "none";
    document.getElementById("appPage").style.display = "block";
    document.getElementById("pageTitle").innerText = "羽毛球借用服務";
    document.getElementById("pageSubTitle").innerText = "單次100元｜租期2小時";
    initMapApp();
}
function enterTennis(){
    currentSport = "tennis";
    document.getElementById("homePage").style.display = "none";
    document.getElementById("appPage").style.display = "block";
    document.getElementById("pageTitle").innerText = "網球借用服務";
    document.getElementById("pageSubTitle").innerText = "單次100元｜租期2小時";
    initMapApp();
}
function goHome(){
    document.getElementById("homePage").style.display = "flex";
    document.getElementById("appPage").style.display = "none";
    if(map){ map.remove(); map=null; }
    markerList = [];
}

function initMapApp(){
    if(currentSport === "badminton"){
        shopRacketData = badmintonShops.map(s=>{ return {...s, rackets:JSON.parse(JSON.stringify(baseBadminton))}; });
    }else if(currentSport === "tennis"){
        shopRacketData = tennisShops.map(s=>{ return {...s, rackets:JSON.parse(JSON.stringify(baseTennis))}; });
    }else if(currentSport === "basketball"){
        shopRacketData = [...basketballShops];
    }

    if(map){
        markerList.forEach(m=>map.removeLayer(m));
        markerList = [];
    }else{
        map = L.map('map').setView([22.31,114.18],11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
    }

    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(pos){
            myPos.lat = pos.coords.latitude;
            myPos.lng = pos.coords.longitude;
            L.marker([myPos.lat,myPos.lng]).addTo(map).bindPopup("我的位置").openPopup();
        },function(err){console.log("定位失敗");})
    }

    shopRacketData.forEach((shop,index)=>{
        const marker = L.marker([shop.lat,shop.lng]).addTo(map);
        marker.bindPopup(buildPopupHtml(shop,index));
        markerList.push(marker);
    })

    map.off("popupopen");
    map.on("popupopen",function(e){
        const popupDom = e.popup.getElement();
        const shopIndex = Number(e.popup.getContent().match(/shopIndex=(\d+)/)[1]);
        currentShopIdx = shopIndex;
        const shop = shopRacketData[shopIndex];

        if(currentSport === "badminton" || currentSport === "tennis"){
            popupDom.querySelectorAll(".rent-btn").forEach(btn=>{
                const rIdx = Number(btn.dataset.ridx);
                if(btn.dataset.op === "rent"){
                    btn.onclick = ()=> openRentDialog(shopIndex,rIdx);
                }else if(btn.dataset.op === "return"){
                    btn.onclick = ()=>{
                        openReturnPhotoMask(shopIndex,rIdx);
                    }
                }
            })
        }else if(currentSport === "basketball"){
            popupDom.querySelector(".book-btn").onclick = ()=> openBookDialog(shopIndex);
        }

        popupDom.querySelectorAll(".nav-group button").forEach(navBtn=>{
            navBtn.onclick = ()=>{
                const mode = navBtn.dataset.mode;
                const destLat = shop.lat;
                const destLng = shop.lng;
                let appleUrl;
                if(myPos.lat && myPos.lng){
                    appleUrl = `http://maps.apple.com/?saddr=${myPos.lat},${myPos.lng}&daddr=${destLat},${destLng}&dirflg=${mode}`;
                }else{
                    appleUrl = `http://maps.apple.com/?daddr=${destLat},${destLng}&dirflg=${mode}`;
                }
                window.open(appleUrl,"_blank");
            }
        })
    })
}

function buildPopupHtml(shop,shopIndex){
    if(currentSport === "basketball"){
        return `<!--shopIndex=${shopIndex}-->
        <div class="popup-wrap">
            <h4>${shop.name}</h4>
            <div>${shop.address}</div>
            <div style="margin:12px 0;">
                <button class="book-btn btn-primary">預約本場館</button>
            </div>
            <div class="nav-group">
                <button class="btn-walk" data-mode="w">步行(蘋果地圖)</button>
                <button class="btn-car" data-mode="d">駕車(蘋果地圖)</button>
                <button class="btn-transit" data-mode="r">公交(蘋果地圖)</button>
            </div>
        </div>`;
    }else{
        let racketHtml = "";
        shop.rackets.forEach((r,ri)=>{
            racketHtml += `
            <div class="racket-row">
                <span>${r.name} 庫存：${r.stock}/${r.max}</span>
                <div>
                    <button class="rent-btn" data-op="rent" data-ridx="${ri}" ${r.stock<=0?"disabled":""}>借用</button>
                    <button class="rent-btn" data-op="return" data-ridx="${ri}" ${r.stock>=r.max?"disabled":""}>歸還</button>
                </div>
            </div>`
        })
        return `<!--shopIndex=${shopIndex}-->
        <div class="popup-wrap">
            <h4>${shop.name}</h4>
            <div>${shop.address}</div>
            <div style="margin:10px 0;"></div>
            ${racketHtml}
            <div class="nav-group">
                <button class="btn-walk" data-mode="w">步行(蘋果地圖)</button>
                <button class="btn-car" data-mode="d">駕車(蘋果地圖)</button>
                <button class="btn-transit" data-mode="r">公交(蘋果地圖)</button>
            </div>
        </div>`;
    }
}

function refreshCurrentPopup(){
    map.closePopup();
    const shop = shopRacketData[currentShopIdx];
    L.popup().setLatLng([shop.lat,shop.lng]).setContent(buildPopupHtml(shop,currentShopIdx)).openOn(map);
}

function openReturnPhotoMask(shopIdx,racketIdx){
    currentShopIdx = shopIdx;
    currentRacketIdx = racketIdx;
    selectedReturnImageFile = null;
    document.getElementById("returnPreviewBox").innerHTML = `<span style="color:#999;">照片預覽區域</span>`;
    document.getElementById("returnPhotoInput").value = "";
    document.getElementById("submitReturnBtn").disabled = true;
    document.getElementById("returnPhotoMask").style.display = "flex";
}
function closeReturnPhotoMask(){
    document.getElementById("returnPhotoMask").style.display = "none";
    selectedReturnImageFile = null;
}

function submitReturn(){
    if(!selectedReturnImageFile){
        alert("請先上傳球拍歸還實拍照片");
        return;
    }
    const shop = shopRacketData[currentShopIdx];
    const racket = shop.rackets[currentRacketIdx];
    if(racket.stock >= racket.max){
        alert("庫存已滿，不需要歸還");
        closeReturnPhotoMask();
        return;
    }
    racket.stock +=1;
    closeReturnPhotoMask();
    alert(`歸還驗證完成，已保存歸還照片，${racket.name} 當前庫存：${racket.stock}`);
    refreshCurrentPopup();
}

function openRentDialog(shopIdx,racketIdx){
    currentShopIdx = shopIdx;
    currentRacketIdx = racketIdx;
    const shop = shopRacketData[shopIdx];
    const racket = shop.rackets[currentRacketIdx];
    const now = new Date();
    const expire = new Date(now.getTime() + 2*3600*1000);
    const orderNo = "ORD" + Date.now();
    activeOrder = {
        no:orderNo,
        shop:shop.name,
        racket:racket.name,
        start:now.toLocaleString(),
        expire:expire.toLocaleString()
    }
    document.getElementById("orderInfo").innerText =
`訂單號：${orderNo}
場館：${shop.name}
器材：${racket.name}
費用：100元（租期2小時）`;

    document.getElementById("payQrImg").src = "";
    document.getElementById("payMask").style.display = "flex";
}

function switchQr(type){
    const img = document.getElementById("payQrImg");
    if(type === "alipay") img.src = "alipay.png";
    if(type === "wechat") img.src = "wechat.png";
}

function confirmPay(){
    if(!activeOrder) return;
    const shop = shopRacketData[currentShopIdx];
    const racket = shop.rackets[currentRacketIdx];
    racket.stock -=1;
    closePay();
    refreshCurrentPopup();
    const unboxText = `UNBOX‑${activeOrder.no}‑SIMULATE‑OPEN‑KEY‑DEMO`;
    QRCode.toCanvas(document.getElementById("unboxCanvas"), unboxText, {width:220});
    document.getElementById("unboxMask").style.display = "flex";
}

function closePay(){
    document.getElementById("payMask").style.display = "none";
    activeOrder = null;
    document.getElementById("payQrImg").src = "";
}

function renderTicket(order){
    const mask = document.getElementById("ticketMask");
    const infoDom = document.getElementById("ticketInfo");
    const canvas = document.getElementById("ticketCanvas");
    const contentText =
`訂單號：${order.no}
場館：${order.shop}
器材：${order.racket}
借用開始：${order.start}
到期時間：${order.expire}`;
    infoDom.innerText = contentText;
    QRCode.toCanvas(canvas,contentText,{width:220});
    mask.style.display = "flex";
}

function closeUnbox(){
    document.getElementById("unboxMask").style.display = "none";
    renderTicket(activeOrder);
}

function closeTicket(){
    document.getElementById("ticketMask").style.display = "none";
}

function openBookDialog(shopIdx){
    currentShopIdx = shopIdx;
    const shop = shopRacketData[shopIdx];
    document.getElementById("bookVenue").value = shop.name;
    document.getElementById("bookDate").valueAsDate = new Date();
    document.getElementById("bookName").value = "";
    document.getElementById("bookPhone").value = "";
    document.getElementById("bookMask").style.display = "flex";
}

function closeBook(){
    document.getElementById("bookMask").style.display = "none";
}

function submitBook(){
    const venue = document.getElementById("bookVenue").value;
    const bDate = document.getElementById("bookDate").value;
    const bTime = document.getElementById("bookTime").value;
    const name = document.getElementById("bookName").value.trim();
    const phone = document.getElementById("bookPhone").value.trim();
    if(!name || !phone){
        alert("請填寫姓名和聯絡電話");
        return;
    }
    const bookNo = "BK" + Date.now();
    bookOrder = {
        no:bookNo,
        venue:venue,
        date:bDate,
        time:bTime,
        name:name,
        phone:phone
    }
    closeBook();
    const mask = document.getElementById("ticketMask");
    const infoDom = document.getElementById("ticketInfo");
    const canvas = document.getElementById("ticketCanvas");
    const txt =
`籃球場館預約憑證
預約編號：${bookNo}
場館：${venue}
日期：${bDate}
時段：${bTime}
預約人：${name}
聯絡：${phone}`;
    infoDom.innerText = txt;
    QRCode.toCanvas(canvas,txt,{width:220});
    mask.style.display = "flex";
}
